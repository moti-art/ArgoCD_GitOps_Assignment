apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/moti-art/ArgoCD_GitOps_Assignment.git
    targetRevision: main  # כאן אנחנו מצביעים על ענף ה-main!
    path: charts/myapp
    helm:
      valueFiles:
        - values-prod.yaml # כאן אנחנו משתמשים בקובץ הפרוד (3 רפליקות)
  destination:
    server: https://kubernetes.default.svc
    namespace: prod       # namespace אחר לגמרי
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true